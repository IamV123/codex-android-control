plugins { id 'com.android.application' }

android {
    enableKotlin = false
    namespace 'io.github.iamv123.codexandroid'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.iamv123.codexandroid'
        minSdk 33
        targetSdk 36
        versionCode 8
        versionName '0.1.8'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('CAC_KEYSTORE')) {
                storeFile file(System.getenv('CAC_KEYSTORE'))
                storePassword System.getenv('CAC_STORE_PASSWORD')
                keyAlias 'release'
                keyPassword System.getenv('CAC_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('CAC_KEYSTORE')) { signingConfig signingConfigs.release }
            minifyEnabled false
            debuggable false
        }
    }
    lint { abortOnError true }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
